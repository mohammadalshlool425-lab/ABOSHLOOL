<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أضف إعلانك | شمعة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-container { background: #fff; width: 100%; max-width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h2 { color: #0056b3; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 15px; outline: none; margin-bottom: 10px; }
        input:focus, textarea:focus, select:focus { border-color: #0056b3; box-shadow: 0 0 5px rgba(0,86,179,0.2); }
        textarea { resize: vertical; height: 120px; }
        .btn-submit { background: #ff7b00; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #e06d00; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #0056b3; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>إضافة إعلان جديد 📢</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label>عنوان الإعلان:</label>
                <input type="text" name="title" required placeholder="مثال: آيفون 13 برو نظيف جداً">
            </div>

            <div class="form-group">
                <label>القسم:</label>
                <select name="category">
                    <option value="">اختر القسم</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>السعر (بالدينار):</label>
                <input type="number" name="price" required placeholder="مثال: 350">
            </div>

            <div class="form-group">
                <label>تفاصيل الإعلان:</label>
                <textarea name="description" required placeholder="اكتب تفاصيل السلعة، الحالة، ومكان الاستلام..."></textarea>
            </div>

            <div class="form-group">
                <label>صورة الإعلان:</label>
                <input type="file" name="image">
            </div>

            <button type="submit" class="btn-submit">نشر الإعلان</button>
        </form>
        <a href="{% url 'dashboard' %}" class="back-link">← العودة للوحة التحكم</a>
    </div>
</body>
</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة إعلان جديد</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow p-4 border-0" style="border-radius: 15px;">
            <h2 class="mb-4 text-primary text-center fw-bold">إضافة إعلان جديد 📢</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">عنوان الإعلان</label>
                    <div class="input-group">
                        <input type="text" id="ad_title" name="title" class="form-control" placeholder="مثال: سيارة تويوتا كامري 2020" required>
                        <button type="button" class="btn btn-outline-primary fw-bold" onclick="generateAI()">✨ وصف ذكي</button>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">القسم</label>
                    <select name="category" class="form-select">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">السعر (دينار)</label>
                    <input type="number" step="0.01" name="price" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">تفاصيل الإعلان</label>
                    <textarea id="ad_desc" name="description" rows="5" class="form-control" placeholder="اكتب التفاصيل أو استخدم زر الوصف الذكي بالأعلى..." required></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">صورة الإعلان</label>
                    <input type="file" name="image" class="form-control">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold">نشر الإعلان 🚀</button>
            </form>
            <div class="text-center mt-3">
                <a href="/dashboard/" class="text-secondary text-decoration-none">العودة إلى لوحة التحكم</a>
            </div>
        </div>
    </div>

    <!-- سكريبت الذكاء الاصطناعي -->
    <script>
        function generateAI() {
            const title = document.getElementById('ad_title').value;
            if(!title) { 
                alert('الرجاء كتابة "عنوان الإعلان" أولاً ليقوم الذكاء الاصطناعي بوصفه!'); 
                return; 
            }
            
            const descBox = document.getElementById('ad_desc');
            descBox.value = '⏳ جاري كتابة الوصف باستخدام الذكاء الاصطناعي...';
            
            fetch('/ai-generate/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({title: title})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) { 
                    descBox.value = data.description; 
                } else { 
                    descBox.value = '';
                    alert('حدث خطأ، يرجى المحاولة مرة أخرى.'); 
                }
            });
        }
    </script>
</body>
</html>
