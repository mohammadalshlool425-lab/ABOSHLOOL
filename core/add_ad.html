<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمعة 🕯️ | أضف إعلاناً جديداً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-container { background: #fff; width: 100%; max-width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h2 { color: #0056b3; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        input[type="text"], input[type="number"], textarea, select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 15px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: #0056b3; box-shadow: 0 0 5px rgba(0,86,179,0.2); }
        textarea { resize: vertical; height: 100px; }
        .btn-submit { background: #ff7b00; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #e06d00; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #0056b3; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>أضف إعلانك الجديد 📢</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label>عنوان الإعلان:</label>
                <input type="text" name="title" required placeholder="مثال: آيفون 13 برو ماكس نظيف جداً">
            </div>

            <div class="form-group">
                <label>القسم:</label>
                <select name="category">
                    <option value="">اختر القسم المناسب</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>التفاصيل:</label>
                <textarea name="description" required placeholder="اكتب تفاصيل السلعة، حالتها، ومكان تواجدك..."></textarea>
            </div>

            <div class="form-group">
                <label>السعر (بالدينار):</label>
                <input type="number" step="0.01" name="price" required placeholder="مثال: 350">
            </div>

            <div class="form-group">
                <label>صورة الإعلان:</label>
                <input type="file" name="image">
            </div>

            <button type="submit" class="btn-submit">نشر الإعلان الآن 🚀</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">العودة للرئيسية</a>
    </div>

</body>
</html>
